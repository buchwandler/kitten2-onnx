[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kitten2-onnx"
dynamic = ["version"]
description = "Experimental ONNX export and parity tooling for KittenTTS 2."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "onnx>=1.17",
  "onnxruntime>=1.22",
  "safetensors>=0.5",
  "torch>=2.7",
  "soundfile>=0.13",
  "kitten-text-processing==0.1.0",
  "transformers==4.57.1",
]

[project.scripts]
kitten2-synthesize = "kitten2_onnx.synthesize:main"
kitten2-export = "kitten2_onnx.export_all:main"
kitten2-validate = "kitten2_onnx.validate_bundle:main"

[project.optional-dependencies]
export = [
  "onnxscript>=0.3.1",
  "huggingface-hub>=0.34",
  "accelerate>=0.26",
]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]
kitten = [
  "huggingface-hub>=0.34",
  "librosa>=0.11",
  "soundfile>=0.13",
]

decoder-reference = [
  "diffusers>=0.35.2,<0.36",
  "kittenml @ git+https://github.com/KittenML/KittenTTS.git@36ef3090ca1e59122a81fc23be4a659a502b9d55",
]
[tool.setuptools]
packages = ["kitten2_onnx", "scripts"]

[tool.setuptools_scm]
fallback_version = "0.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
